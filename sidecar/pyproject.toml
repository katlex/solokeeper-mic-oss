[project]
name = "solokeeper-sidecar"
version = "0.2.0"
description = "SoloKeeper Mic transcription + diarization sidecar"
requires-python = ">=3.10"
dependencies = [
    "faster-whisper>=1.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.0.0",
    "pyannote.audio>=3.1.0",
    "torch>=2.0.0",
    "sounddevice>=0.5.5",
]

[project.scripts]
solokeeper-sidecar = "server:main"
